name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:protocol-generation
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # the build must succeed without a database or any token
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
