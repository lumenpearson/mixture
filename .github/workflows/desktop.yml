name: desktop

# The Windows bundles are built by release.yml, from the commit on master that
# passed ci. This workflow keeps only the compile check that a pull request
# touching the shell needs, so a tag or a release never builds the shell twice.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
      # the shell embeds a static export of the web app, so a change that
      # breaks the export breaks the bundle. Besides the two files that define
      # the export, these are what it removes and rewrites: a route handler or
      # a route-segment directive that moves makes `build-desktop.mjs` fail.
      - "apps/web/next.config.mjs"
      - "apps/web/scripts/build-desktop.mjs"
      - "apps/web/package.json"
      - "apps/web/app/page.tsx"
      - "apps/web/app/manifest.ts"
      - "apps/web/app/api/**"
      - "apps/web/app/insert/**"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # every pull request that touches the shell compiles the rust side; linux is
  # enough to catch the code, the windows bundle is only built for a release.
  # The export runs too: a release build embeds it through `generate_context!`
  # (a debug build resolves `devUrl` instead and never reads it), so without
  # this step a broken export would only surface while cutting a release.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      # no NEXT_PUBLIC_MIXTURE_API_URL here on purpose: this job checks that
      # the export builds, and only the release decides which api it points at
      - name: export the interface the bundle ships
        run: pnpm --filter web build:desktop
      - name: install webkit and gtk headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml
