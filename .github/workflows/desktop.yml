name: desktop

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "url the shell opens (MIXTURE_DESKTOP_URL)"
        required: false
        default: "https://mixture-codeilluminators.vercel.app"
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # every pull request that touches the shell compiles the rust side; linux is
  # enough to catch the code, the windows bundle is only built for a release
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install webkit and gtk headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo check --locked --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: cargo test --locked --lib --manifest-path apps/desktop/src-tauri/Cargo.toml

  # the installer itself: windows only, nsis, uploaded as an artefact
  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          # baked into the binary: which deployment the window opens
          MIXTURE_DESKTOP_URL: ${{ inputs.site_url || 'https://mixture-codeilluminators.vercel.app' }}
        with:
          projectPath: apps/desktop
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: mixture-screenkit-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
