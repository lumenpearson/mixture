[package]
name = "mixture-screenkit-desktop"
version = "0.1.0"
description = "mixture · screenkit desktop shell"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# the tauri template layout: main.rs is a thin wrapper around the library so the
# same code can be compiled for other targets later
name = "mixture_screenkit_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset serves the granted folder to <img>/<video> through convertFileSrc
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
mime_guess = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
